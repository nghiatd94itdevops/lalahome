<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LalaHome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Be+Vietnam+Pro:wght@400;600&display=swap">
<style>
/* Layout: one full-screen cover, the painting itself. Light motion only: the painted cat breathes, blinks and tilts its head, butterflies fly, leaves and petals drift, chimney smoke and lanterns, optional soft music. */
:root {
  --sky: #a9cfe8;
  --lid: #d9944f;
  --lid-low: #e9b47a;
  --lash: #3a2416;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: #2f4a3a; overflow: hidden; font-family: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif; color: #3b2a1e; }

/* The painting is never cropped through viewBox (that would move the animation pivots). Instead the whole SVG keeps
   its 1672×941 coordinates and is scaled/positioned in px by fitScene() so the important area always stays visible;
   any space the painting cannot cover shows a blurred copy of it. */
.stage { position: relative; width: 100%; height: 100%; overflow: hidden; }
.backdrop { position: absolute; inset: -40px; background: url("assets/home/home.jpg?v=479ddd6c") center / cover no-repeat; filter: blur(22px) saturate(1.1) brightness(.92); transform: scale(1.05); }
.cover { position: absolute; left: 0; top: 0; display: block; max-width: none; }

/* Landscape: only the music button (fixed in the corner) shows from the panel. */
.welcome-panel > :not(.music-toggle) { display: none; }
body.is-portrait .welcome-panel > :not(.music-toggle) { display: revert; }
body.is-portrait .welcome-panel > .welcome-actions { display: grid; }
body.is-portrait { overflow-y: auto; background: #fbf3e4; }
body.is-portrait .stage { height: auto; border-bottom: 3px solid #6b4423; }
body.is-portrait .welcome-panel { display: grid; gap: 14px; padding: 22px 18px calc(28px + env(safe-area-inset-bottom, 0px)); }
.welcome-panel h1 { margin: 0; font: 800 clamp(30px, 8vw, 40px)/1.05 "Baloo 2", "Trebuchet MS", sans-serif; color: #3b2a1e; }
.welcome-panel p { margin: 0; font-size: 16px; line-height: 1.6; color: #6e5a48; }
.welcome-actions { display: grid; gap: 10px; }
.welcome-actions a { display: flex; align-items: center; justify-content: center; min-height: 52px; padding: 12px 18px; border-radius: 999px; border: 2.5px solid #6b4423; box-shadow: 0 4px 0 #6b4423; font: 800 18px/1.2 "Baloo 2", "Trebuchet MS", sans-serif; text-decoration: none; }
.welcome-actions .primary { background: #2f6d8c; color: #fff; }
.welcome-actions .secondary { background: #fff9ef; color: #3b2a1e; }
.welcome-hint { font-size: 14px !important; }
body.is-portrait .music-toggle { position: static; justify-self: start; }

.glows { mix-blend-mode: screen; }
.glow { animation: flicker 3.2s ease-in-out infinite; }
.glow:nth-child(2) { animation-duration: 2.7s; animation-delay: -1s; }
.glow:nth-child(3) { animation-duration: 3.6s; animation-delay: -2s; }
.glow:nth-child(4) { animation-duration: 2.4s; animation-delay: -.5s; }
.smoke circle { fill: #fff; filter: url(#soft); opacity: 0; animation: smoke 6.3s ease-out infinite; animation-delay: calc(var(--i) * -.7s); transform-box: fill-box; transform-origin: center; }

.cat-breath { transform-origin: 630px 737px; animation: breathe 3.6s ease-in-out infinite; }
.cat-head { transform-origin: 633px 662px; animation: head-tilt 7.5s ease-in-out infinite; }
.lid { fill: url(#lidFur); transform-box: fill-box; transform-origin: 50% 0%; transform: scaleY(0); animation: blink 6s ease-in-out infinite; }
.lash { fill: none; stroke: var(--lash); stroke-width: 1.4; stroke-linecap: round; opacity: 0; animation: lash 6s ease-in-out infinite; }
.cat-hit { fill: transparent; cursor: pointer; }
.door-link rect { fill: transparent; cursor: pointer; }
.door-link:focus-visible rect { stroke: #fff4cc; stroke-width: 4; stroke-dasharray: 12 9; }
.door-link:focus { outline: none; }
.door-glow { fill: #ffcf7a; mix-blend-mode: screen; opacity: 0; animation: door-pulse 2.8s ease-in-out infinite; transition: opacity .3s ease; }
.door-link:hover .door-glow, .door-link:focus-visible .door-glow { animation: none; opacity: .42; }
.door-sign { transform-origin: 835px 568px; animation: sign-swing 3.2s ease-in-out infinite alternate; }
.door-link:hover .door-sign, .door-link:focus-visible .door-sign { animation-duration: .5s; }
.door-sign .plank { fill: url(#plankWood); stroke: #5a3417; stroke-width: 2.5; }
.door-sign .string { fill: none; stroke: #e9d3a8; stroke-width: 1.8; stroke-linecap: round; }
.door-sign .grain { fill: none; stroke: #8b5a2b; stroke-width: 1; opacity: .45; stroke-linecap: round; }
.door-sign text { font-family: "Baloo 2", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif; font-weight: 800; font-size: 22px; fill: #4a2a12; text-anchor: middle; dominant-baseline: central; }
.sign-text { font-family: "Baloo 2", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif; font-weight: 800; font-size: 60px; text-anchor: middle; letter-spacing: 1px; }
.sign-ink { fill: url(#signInk); stroke: #2a1406; stroke-width: 2.4; paint-order: stroke; stroke-linejoin: round; }
.sign-light { fill: #f6d29a; opacity: .55; }
.lantern-swing { transform-origin: 486px 361px; animation: lantern-swing 4.2s ease-in-out infinite alternate; }
.glass-shine { mix-blend-mode: screen; opacity: .16; }
.float-up { animation: float-up 2.4s ease-out forwards; }
.cat-hit:focus { outline: none; }
.cat-hit:focus-visible { stroke: #fff4cc; stroke-width: 3; stroke-dasharray: 10 7; }
/* Only a feathered patch inside each body moves, so the flowers and wall around the cut-out stay still. */
.sleeper-breath { transform-origin: 380px 800px; animation: sleep-breathe 4s ease-in-out infinite; }
.eater-breath { transform-origin: 1325px 808px; animation: eat-breathe 3s ease-in-out infinite; }
/* pivot at the base of the far ear, so the edge against the body barely moves; negative angles push the face into the bowl */
.eater-head { transform-origin: 1265px 735px; animation: eat-dip 3.4s ease-in-out infinite; }
.zzz text { font: 800 15px "Baloo 2", "Trebuchet MS", sans-serif; fill: #fff7e0; stroke: #5a3a22; stroke-width: .9; paint-order: stroke; opacity: 0; transform-box: fill-box; transform-origin: center; animation: zzz 4.5s ease-out infinite; }
.zzz text:nth-child(2) { animation-delay: -1.5s; font-size: 12px; }
.zzz text:nth-child(3) { animation-delay: -3s; font-size: 18px; }
.crumb { fill: #8a5226; stroke: #4a2a12; stroke-width: .6; opacity: 0; animation: crumb-hop 2.6s ease-out infinite; }
.crumb:nth-child(2) { animation-delay: -.9s; }
.crumb:nth-child(3) { animation-delay: -1.7s; }

.leaf { animation: fall var(--dur) linear forwards; }
.leaf path { transform-box: fill-box; transform-origin: center; animation: tumble var(--spin) ease-in-out infinite alternate; }
.wing { transform-box: fill-box; animation: flap var(--flap, .2s) ease-in-out infinite alternate; }
.wing-l { transform-origin: 100% 50%; } .wing-r { transform-origin: 0% 50%; }

@keyframes door-pulse { 0%, 100% { opacity: 0; } 50% { opacity: .28; } }
@keyframes sign-swing { from { transform: rotate(-2.5deg); } to { transform: rotate(2.5deg); } }
@keyframes lantern-swing { 0% { transform: rotate(-3.2deg); } 45% { transform: rotate(2.4deg); } 70% { transform: rotate(1.6deg); } 100% { transform: rotate(3.4deg); } }
@keyframes flicker { 0%, 100% { opacity: .8; } 40% { opacity: 1; } 55% { opacity: .65; } 70% { opacity: .92; } }
@keyframes smoke { 0% { opacity: 0; transform: translate(0, 0) scale(.45); } 12% { opacity: .9; } 50% { opacity: .6; transform: translate(calc(var(--dx) * .35), -70px) scale(calc(var(--s) * .6)); } 100% { opacity: 0; transform: translate(var(--dx), -150px) scale(var(--s)); } }
@keyframes breathe { 0%, 100% { transform: rotate(-.7deg) scale(1, 1); } 50% { transform: rotate(.7deg) scale(1.008, 1.018); } }
@keyframes head-tilt { 0%, 30%, 70%, 88%, 100% { transform: rotate(0deg) translateY(0); } 10% { transform: rotate(4.2deg); } 22% { transform: rotate(4.5deg); } 36% { transform: rotate(0deg) translateY(1.5px); } 41% { transform: rotate(0deg) translateY(0); } 50% { transform: rotate(-3.8deg); } 62% { transform: rotate(-4deg); } 78% { transform: rotate(2.2deg) translateY(.8px); } }
@keyframes blink { 0%, 38%, 44%, 84%, 89%, 90.5%, 95%, 100% { transform: scaleY(0); } 40%, 42%, 86%, 87.5%, 91.5%, 93% { transform: scaleY(1); } }
@keyframes lash { 0%, 39.5%, 43%, 85.5%, 88.5%, 91%, 94%, 100% { opacity: 0; } 40.5%, 42%, 86.5%, 87.5%, 92%, 93% { opacity: .85; } }
/* layers only ever grow from their resting size, so nothing behind them is uncovered */
@keyframes sleep-breathe { 0%, 100% { transform: scale(1, 1); } 42%, 55% { transform: scale(1.02, 1.09); } }
@keyframes eat-breathe { 0%, 100% { transform: scale(1, 1); } 50% { transform: scale(1.012, 1.035); } }
@keyframes eat-dip { 0%, 100% { transform: translate(0, 0) rotate(0deg); } 12%, 32%, 52% { transform: translate(-4px, 3px) rotate(-7deg); } 22%, 42% { transform: translate(-1.5px, 1px) rotate(-3deg); } 66% { transform: translate(-.5px, .3px) rotate(-1deg); } }
@keyframes zzz { 0% { opacity: 0; transform: translate(0, 0) scale(.6); } 15% { opacity: 1; } 100% { opacity: 0; transform: translate(18px, -30px) scale(1.2); } }
@keyframes crumb-hop { 0%, 55% { opacity: 0; transform: translate(0, 0); } 62% { opacity: 1; } 78% { opacity: 1; transform: translate(var(--dx), -9px); } 95%, 100% { opacity: 0; transform: translate(calc(var(--dx) * 1.6), 0); } }
@keyframes float-up { 0% { opacity: 0; transform: translate(0, 0) scale(.6); } 15% { opacity: 1; transform: translate(0, -10px) scale(1); } 100% { opacity: 0; transform: translate(var(--dx, -20px), -90px) scale(1.1); } }
@keyframes fall { 0% { transform: translate(0, 0) rotate(0deg); opacity: 0; } 6% { opacity: 1; } 88% { opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; } }
@keyframes tumble { from { transform: scaleX(1); } to { transform: scaleX(.15); } }
@keyframes flap { from { transform: scaleX(1); } to { transform: scaleX(.22); } }

.music-toggle {
  position: fixed; z-index: 2;
  left: calc(clamp(8px, 1.4vw, 16px) + env(safe-area-inset-left, 0px)); top: calc(clamp(8px, 1.4vw, 16px) + env(safe-area-inset-top, 0px));
  display: inline-flex; align-items: center; gap: 6px; padding: clamp(4px, .6vw, 7px) clamp(10px, 1.2vw, 14px) clamp(4px, .6vw, 7px) clamp(8px, .9vw, 10px);
  font: 800 clamp(13px, 1.25vw, 16px)/1 "Baloo 2", "Trebuchet MS", sans-serif; color: #3b2a1e;
  background: #fff6e6; border: 2.5px solid #6b4423; border-radius: 999px; box-shadow: 0 3px 0 #6b4423; cursor: pointer;
}
.music-toggle svg { width: 20px; height: 20px; fill: none; stroke: #3b2a1e; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.music-toggle[aria-pressed="true"] { background: #f6c56a; }
.music-toggle[aria-pressed="true"] svg { animation: note-bob 1.2s ease-in-out infinite alternate; }
.music-toggle.is-waiting { animation: music-nudge 1.6s ease-in-out infinite; }
.music-toggle:focus-visible { outline: 3px solid #2f6d8c; outline-offset: 3px; }
@keyframes music-nudge { 0%, 100% { box-shadow: 0 3px 0 #6b4423, 0 0 0 0 rgba(246, 197, 106, .7); } 50% { box-shadow: 0 3px 0 #6b4423, 0 0 0 8px rgba(246, 197, 106, 0); } }
@keyframes note-bob { from { transform: translateY(1px) rotate(-6deg); } to { transform: translateY(-2px) rotate(6deg); } }

/* The cats are left out on purpose: their breathing and eating are slow and small, and slowed further they looked frozen. */
@media (prefers-reduced-motion: reduce) {
  .cat-head, .smoke circle { animation-duration: 16s; }
  .lantern-swing { animation-duration: 7s; }
  .door-sign { animation-duration: 5s; }
  .door-glow { animation-duration: 5s; }
  .glow { animation-duration: 6s; }
}
</style>
</head>

<script>
(function () {
  const SVG_NS = "http://www.w3.org/2000/svg";
  const SCENE = { width: 1672, height: 941 };
  // Areas that must stay fully visible: chimney, LALAHOME sign, door, window, the three cats, lantern and the path.
  const SAFE_LANDSCAPE = { x: 255, y: 50, width: 1385, height: 880 };
  const SAFE_PORTRAIT = { x: 255, y: 110, width: 1245, height: 810 };
  const PORTRAIT_BELOW_RATIO = 1;
  const prefersReducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const LEAF_SPAWN_MS = prefersReducedMotion ? 800 : 330;
  const MAX_LEAVES = prefersReducedMotion ? 14 : 34;
  const LEAF_SLOWDOWN = prefersReducedMotion ? 1.6 : 1;
  const BUTTERFLY_SPEED = prefersReducedMotion ? 0.55 : 1;
  const LEAF_COLOURS = ["#8dbb3e", "#a6c94a", "#6f9e32", "#c9d65a", "#e2b54a", "#d98f3a"];
  const PETAL_COLOURS = ["#ffb3c6", "#ffffff", "#ff8fab", "#fff1a8"];

  const cover = document.getElementById("cover");
  const between = (min, max) => min + Math.random() * (max - min);
  const pick = (list) => list[Math.floor(Math.random() * list.length)];
  const clamp = (value, min, max) => Math.min(Math.max(value, min), max);

  function svgEl(tag, attrs, parent) {
    const node = document.createElementNS(SVG_NS, tag);
    for (const [key, value] of Object.entries(attrs)) node.setAttribute(key, value);
    parent.appendChild(node);
    return node;
  }

  const stage = document.getElementById("stage");

  // Picks the part of the painting to show: as much as the screen shape allows, never less than the safe area.
  function cropFor(screenRatio, safe) {
    let width = SCENE.width;
    let height = SCENE.width / screenRatio;
    if (height > SCENE.height) {
      height = SCENE.height;
      width = SCENE.height * screenRatio;
    }
    if (width < safe.width) {
      width = safe.width;
      height = width / screenRatio;
    }
    if (height < safe.height) {
      height = safe.height;
      width = height * screenRatio;
    }
    const place = (size, safeStart, safeSize, total) => {
      const centred = safeStart + safeSize / 2 - size / 2;
      return size >= total ? (total - size) / 2 : clamp(centred, 0, total - size);
    };
    return { x: place(width, safe.x, safe.width, SCENE.width), y: place(height, safe.y, safe.height, SCENE.height), width, height };
  }

  function fitScene() {
    const portrait = window.innerWidth / window.innerHeight < PORTRAIT_BELOW_RATIO;
    document.body.classList.toggle("is-portrait", portrait);
    const stageWidth = stage.clientWidth;
    let crop;
    if (portrait) {
      crop = { ...SAFE_PORTRAIT };
      stage.style.height = `${Math.round(stageWidth * crop.height / crop.width)}px`;
    } else {
      stage.style.height = "";
      crop = cropFor(stageWidth / stage.clientHeight, SAFE_LANDSCAPE);
    }
    const scale = stageWidth / crop.width;
    cover.style.width = `${SCENE.width * scale}px`;
    cover.style.height = `${SCENE.height * scale}px`;
    cover.style.transform = `translate(${(-crop.x * scale).toFixed(1)}px, ${(-crop.y * scale).toFixed(1)}px)`;
  }
  fitScene();
  window.addEventListener("resize", fitScene);

  const hearts = document.getElementById("hearts");
  function floatHeart({ x, y }) {
    const heart = svgEl("path", {
      class: "float-up",
      d: "M0 6C-12 -4 -14 -14 -7 -17C-3 -19 0 -16 0 -13C0 -16 3 -19 7 -17C14 -14 12 -4 0 6Z",
      fill: "#ff7b9c", stroke: "#6b4423", "stroke-width": 2,
      transform: `translate(${between(x - 15, x + 15).toFixed(0)} ${y}) scale(1.5)`,
      style: `--dx: ${between(-30, 30).toFixed(0)}px`,
    }, hearts);
    heart.addEventListener("animationend", () => heart.remove());
  }
  const HEART_ORIGINS = { cat: { x: 635, y: 598 }, catSleeper: { x: 468, y: 706 }, catEater: { x: 1300, y: 690 } };
  for (const [id, origin] of Object.entries(HEART_ORIGINS)) {
    const pet = document.getElementById(id);
    pet.addEventListener("click", () => floatHeart(origin));
    pet.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" && event.key !== " ") return;
      event.preventDefault();
      floatHeart(origin);
    });
  }

  // Background music settings. Browsers only allow sound after the visitor's first tap, click or key press,
  // so "autoplay" starts the music at that moment. Leave "src" empty for the built-in music box, or point it
  // at your own file (e.g. "assets/home/music.mp3") to loop that instead.
  const MUSIC = {
    autoplay: true,
    volume: 0.22,
    src: "",
    tempo: 72,
  };
  const FADE_SECONDS = 1.2;
  const SCHEDULE_AHEAD_SECONDS = 0.4;
  const SCHEDULER_TICK_MS = 120;
  const CHORDS = [[60, 64, 67], [57, 60, 64], [53, 57, 60], [55, 59, 62]];
  const MELODY = [72, 74, 76, 79, 81, 84];

  const musicToggle = document.getElementById("musicToggle");
  const musicLabel = document.getElementById("musicLabel");
  const midiToHz = (note) => 440 * Math.pow(2, (note - 69) / 12);

  // A music player reports through onPlayingChange whenever sound actually starts or stops, so the
  // button never has to guess how long the browser takes to open the audio device.
  function createMusicBox(onPlayingChange) {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return null;
    const ctx = new AudioContextClass();
    const master = ctx.createGain();
    master.gain.value = 0;
    const tone = ctx.createBiquadFilter();
    tone.type = "lowpass";
    tone.frequency.value = 2600;
    const echo = ctx.createDelay();
    echo.delayTime.value = 0.33;
    const echoFeedback = ctx.createGain();
    echoFeedback.gain.value = 0.28;
    const echoWet = ctx.createGain();
    echoWet.gain.value = 0.3;
    tone.connect(master);
    tone.connect(echo);
    echo.connect(echoFeedback).connect(echo);
    echo.connect(echoWet).connect(master);
    master.connect(ctx.destination);

    const beat = 60 / MUSIC.tempo;
    let nextBeatTime = 0;
    let beatIndex = 0;
    let timer = null;
    let shouldPlay = false;

    function bell(note, time, level) {
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.0001, time);
      gain.gain.exponentialRampToValueAtTime(level, time + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, time + 1.8);
      gain.connect(tone);
      for (const [type, ratio, share] of [["triangle", 1, 1], ["sine", 2, 0.35]]) {
        const osc = ctx.createOscillator();
        const partial = ctx.createGain();
        osc.type = type;
        osc.frequency.value = midiToHz(note) * ratio;
        partial.gain.value = share;
        osc.connect(partial).connect(gain);
        osc.start(time);
        osc.stop(time + 1.9);
      }
    }

    function pad(chord, time) {
      const length = beat * 4;
      for (const note of chord) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.value = midiToHz(note - 12);
        gain.gain.setValueAtTime(0.0001, time);
        gain.gain.linearRampToValueAtTime(0.035, time + 1);
        gain.gain.linearRampToValueAtTime(0.0001, time + length + 0.6);
        osc.connect(gain).connect(tone);
        osc.start(time);
        osc.stop(time + length + 0.7);
      }
    }

    function scheduleBeat(time) {
      const chord = CHORDS[Math.floor(beatIndex / 4) % CHORDS.length];
      if (beatIndex % 4 === 0) pad(chord, time);
      bell(chord[beatIndex % chord.length] + 12, time, 0.16);
      if (Math.random() < 0.45) bell(pick(MELODY), time + beat / 2, 0.1);
      beatIndex += 1;
    }

    function schedule() {
      // After the tab was throttled or the device stalled, skip missed beats instead of playing them all at once.
      if (nextBeatTime < ctx.currentTime) nextBeatTime = ctx.currentTime + 0.05;
      while (nextBeatTime < ctx.currentTime + SCHEDULE_AHEAD_SECONDS) {
        scheduleBeat(nextBeatTime);
        nextBeatTime += beat;
      }
    }

    function beginSound() {
      if (timer || !shouldPlay || ctx.state !== "running") return;
      nextBeatTime = ctx.currentTime + 0.1;
      timer = setInterval(schedule, SCHEDULER_TICK_MS);
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.setTargetAtTime(MUSIC.volume, ctx.currentTime, FADE_SECONDS / 3);
      onPlayingChange(true);
    }

    function endSound() {
      clearInterval(timer);
      timer = null;
      onPlayingChange(false);
    }

    ctx.addEventListener("statechange", () => {
      if (ctx.state === "running") beginSound();
      else if (timer) endSound();
    });

    return {
      play() {
        shouldPlay = true;
        ctx.resume().catch((error) => console.warn(`Background music is waiting for a tap or key press: ${error.message}`));
        beginSound();
      },
      stop() {
        shouldPlay = false;
        master.gain.cancelScheduledValues(ctx.currentTime);
        master.gain.setTargetAtTime(0, ctx.currentTime, FADE_SECONDS / 4);
        endSound();
      },
      suspend: () => ctx.suspend(),
      resume: () => ctx.resume(),
    };
  }

  function createFilePlayer(src, onPlayingChange) {
    const audio = new Audio(src);
    audio.loop = true;
    audio.volume = MUSIC.volume;
    audio.addEventListener("playing", () => onPlayingChange(true));
    audio.addEventListener("pause", () => onPlayingChange(false));
    return {
      play() {
        audio.play().catch((error) => console.warn(`Background music "${src}" is waiting for a tap or key press: ${error.message}`));
      },
      stop: () => audio.pause(),
      suspend: () => audio.pause(),
      resume: () => audio.play().catch((error) => console.warn(`Background music could not resume: ${error.message}`)),
    };
  }

  let player = null;
  let isPlaying = false;
  let wantsMusic = MUSIC.autoplay;

  function renderMusicButton() {
    musicToggle.setAttribute("aria-pressed", String(wantsMusic));
    musicToggle.classList.toggle("is-waiting", wantsMusic && !isPlaying);
    if (!wantsMusic) musicLabel.textContent = "Nhạc: tắt";
    else musicLabel.textContent = isPlaying ? "Nhạc: bật" : "Nhạc: chạm để nghe";
  }

  function handlePlayingChange(playing) {
    isPlaying = playing;
    renderMusicButton();
  }

  function startMusic() {
    player = player || (MUSIC.src ? createFilePlayer(MUSIC.src, handlePlayingChange) : createMusicBox(handlePlayingChange));
    if (player) player.play();
  }

  function stopMusic() {
    if (player) player.stop();
  }

  musicToggle.addEventListener("click", (event) => {
    event.stopPropagation();
    if (wantsMusic && !isPlaying) {
      startMusic();
      return;
    }
    wantsMusic = !wantsMusic;
    renderMusicButton();
    if (wantsMusic) startMusic();
    else stopMusic();
  });

  document.addEventListener("visibilitychange", () => {
    if (!player || !wantsMusic) return;
    if (document.hidden) player.suspend();
    else player.resume();
  });

  function startOnInteraction(event) {
    if (event.target.closest && event.target.closest("#musicToggle")) return;
    if (wantsMusic && !isPlaying) startMusic();
  }
  ["pointerdown", "keydown", "click", "touchend"].forEach((name) => window.addEventListener(name, startOnInteraction, true));

  renderMusicButton();
  if (wantsMusic) startMusic();

  const leaves = document.getElementById("leaves");
  function spawnLeaf() {
    if (document.hidden || leaves.childElementCount >= MAX_LEAVES) return;
    const isPetal = Math.random() < 0.35;
    const x = isPetal ? between(0, 600) : between(40, 780);
    const y = isPetal ? between(640, 880) : between(30, 330);
    const outer = svgEl("g", { transform: `translate(${x.toFixed(0)} ${y.toFixed(0)})` }, leaves);
    const drift = svgEl("g", {
      class: "leaf",
      style: [
        `--dur: ${(between(7, 13) * LEAF_SLOWDOWN).toFixed(1)}s`,
        `--dx: ${(isPetal ? between(600, 1200) : between(160, 520)).toFixed(0)}px`,
        `--dy: ${(isPetal ? between(-280, -60) : between(520, 840)).toFixed(0)}px`,
        `--rot: ${between(-560, 560).toFixed(0)}deg`,
      ].join(";"),
    }, outer);
    const shape = isPetal ? "M0 0C4 -6 12 -6 12 0C12 6 4 6 0 0Z" : "M0 0C6 -10 20 -10 26 0C20 10 6 10 0 0Z";
    const piece = svgEl("path", {
      d: shape,
      fill: pick(isPetal ? PETAL_COLOURS : LEAF_COLOURS),
      stroke: "rgba(70, 50, 20, .35)", "stroke-width": 1,
      style: `--spin: ${between(0.6, 1.4).toFixed(2)}s`,
    }, drift);
    if (!isPetal) svgEl("path", { d: "M2 0H24", stroke: "rgba(60, 80, 20, .45)", "stroke-width": 1, fill: "none" }, drift);
    drift.addEventListener("animationend", () => outer.remove());
    return piece;
  }
  setInterval(spawnLeaf, LEAF_SPAWN_MS);

  const BUTTERFLIES = [
    { cx: 330, cy: 640, ax: 230, ay: 90, sx: 0.23, sy: 0.41, phase: 0, colour: "#f08a24", size: 1.9, flap: ".2s" },
    { cx: 1330, cy: 580, ax: 220, ay: 110, sx: 0.19, sy: 0.33, phase: 2, colour: "#f5c542", size: 1.7, flap: ".17s" },
    { cx: 980, cy: 230, ax: 280, ay: 70, sx: 0.15, sy: 0.29, phase: 4, colour: "#7fb6f0", size: 1.6, flap: ".22s" },
    { cx: 760, cy: 760, ax: 300, ay: 60, sx: 0.12, sy: 0.37, phase: 1, colour: "#f29bb8", size: 1.5, flap: ".19s" },
  ];
  const butterflyLayer = document.getElementById("butterflies");
  const flyers = BUTTERFLIES.map((spec) => {
    const root = svgEl("g", {}, butterflyLayer);
    const body = svgEl("g", { transform: `scale(${spec.size})` }, root);
    for (const side of ["l", "r"]) {
      const wing = svgEl("g", { class: `wing wing-${side}`, style: `--flap: ${spec.flap}` }, body);
      const shape = svgEl("g", { transform: `scale(${side === "l" ? 1 : -1} 1)` }, wing);
      svgEl("path", { d: "M0 0C-14 -20 -32 -16 -28 -2C-26 6 -10 6 0 0Z", fill: spec.colour, stroke: "#2b1a10", "stroke-width": 2 }, shape);
      svgEl("path", { d: "M0 0C-12 6 -22 18 -11 20C-4 20 -1 9 0 0Z", fill: spec.colour, stroke: "#2b1a10", "stroke-width": 2 }, shape);
      svgEl("circle", { cx: -22, cy: -8, r: 2, fill: "#fff" }, shape);
    }
    svgEl("ellipse", { rx: 2.6, ry: 11, fill: "#2b1a10" }, body);
    svgEl("path", { d: "M0 -10l-4 -8M0 -10l4 -8", stroke: "#2b1a10", "stroke-width": 1.4, fill: "none", "stroke-linecap": "round" }, body);
    return { spec, root, lastX: spec.cx };
  });

  const start = performance.now();
  function frame(now) {
    const t = ((now - start) / 1000) * BUTTERFLY_SPEED;
    for (const flyer of flyers) {
      const { cx, cy, ax, ay, sx, sy, phase } = flyer.spec;
      const x = cx + Math.sin(t * sx * 2 + phase) * ax + Math.sin(t * 1.3 + phase) * 18;
      const y = cy + Math.sin(t * sy * 2 + phase * 1.7) * ay + Math.sin(t * 2.1 + phase) * 12;
      const facing = x >= flyer.lastX ? 1 : -1;
      const tilt = Math.sin(t * 1.7 + phase) * 12;
      flyer.root.setAttribute("transform", `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${tilt.toFixed(1)}) scale(${facing} 1)`);
      flyer.lastX = x;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
