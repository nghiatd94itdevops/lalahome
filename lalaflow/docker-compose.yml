name: lalaflow

services:
  db:
    image: mariadb:11.4
    container_name: lalaflow-db
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
      MARIADB_DATABASE: lalaflow
      MARIADB_USER: lalaflow
      MARIADB_PASSWORD: ${DB_PASSWORD:-lalaflowpass}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$${MARIADB_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build: ./backend
    container_name: lalaflow-backend
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: lalaflow
      DB_PASSWORD: ${DB_PASSWORD:-lalaflowpass}
      DB_NAME: lalaflow
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      CHAT_DAILY_LIMIT: ${CHAT_DAILY_LIMIT:-1000}
      TRUST_PROXY: ${TRUST_PROXY:-}
    ports:
      - "4000:4000"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  backend_uploads:
