  <style>
    .cat-tail, .cat-body, .cat-rise, .cat-head, .cat-thumb, .cat-tap, .cat-spark, .cat-blink { transform-box: view-box; }
    .cat-tail { transform-origin: 352px 420px; animation: cat-tail 3.2s cubic-bezier(.45,0,.55,1) infinite alternate; }
    .cat-body { transform-origin: 250px 466px; animation: cat-body 3s cubic-bezier(.45,0,.55,1) infinite alternate; }
    .cat-rise { animation: cat-rise 3s cubic-bezier(.45,0,.55,1) infinite alternate; }
    .cat-head { transform-origin: 250px 272px; animation: cat-head 6s cubic-bezier(.45,0,.55,1) infinite; }
    .cat-thumb { transform-origin: 168px 300px; animation: cat-thumb 2.6s cubic-bezier(.45,0,.55,1) infinite; }
    .cat-tap { transform-origin: 354px 300px; animation: cat-tap 1.4s cubic-bezier(.45,0,.55,1) infinite; }
    .cat-spark { transform-origin: 110px 130px; animation: cat-spark 1.3s cubic-bezier(.45,0,.55,1) infinite alternate; }
    .cat-blink { animation: cat-blink 5s cubic-bezier(.45,0,.55,1) infinite; }
    @keyframes cat-tail { from { transform: rotate(-5deg); } to { transform: rotate(8deg); } }
    @keyframes cat-body { from { transform: scale(1, 1); } to { transform: scale(1.012, 1.024); } }
    @keyframes cat-rise { from { transform: translateY(0); } to { transform: translateY(-5.5px); } }
    @keyframes cat-head { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(2.5deg); } }
    @keyframes cat-thumb { 0%, 45%, 100% { transform: rotate(0); } 15% { transform: rotate(-9deg); } 30% { transform: rotate(-2deg); } }
    @keyframes cat-tap { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-4deg); } }
    @keyframes cat-spark { from { opacity: .45; transform: scale(.9); } to { opacity: 1; transform: scale(1.08); } }
    @keyframes cat-blink { 0%, 90%, 100% { transform: scaleY(1); } 94% { transform: scaleY(.08); } }
    @media (prefers-reduced-motion: reduce) { :root:not(.motion-on) * { animation: none !important; } }
  </style>
