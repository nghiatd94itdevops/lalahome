# Whole site on one VM: cp .env.example .env, fill it in, then `docker compose up -d --build`.
# Only the web service is published; backend and MariaDB stay on the internal network.
name: lalahome

services:
  db:
    image: mariadb:11.4
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: lalaflow
      MARIADB_USER: lalaflow
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
      - ./lalaflow/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$${MARIADB_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build: ./lalaflow/backend
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: lalaflow
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: lalaflow
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      CHAT_DAILY_LIMIT: ${CHAT_DAILY_LIMIT:-1000}
      TRUST_PROXY: ${TRUST_PROXY:-1}
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: speech-service/Dockerfile
    restart: always
    environment:
      LALAFLOW_API_UPSTREAM: http://backend:4000
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}
      MAX_STREAMS: ${MAX_STREAMS:-5}
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY:-}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION:-southeastasia}
      AZURE_TTS_VOICE: ${AZURE_TTS_VOICE:-vi-VN-HoaiMyNeural}
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - web_logs:/srv/logs
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
  backend_uploads:
  web_logs:
